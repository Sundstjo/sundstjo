<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meme &amp; Slang Quiz</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap');
:root{--ink:#211b35;--muted:#766e87;--cream:#fffaf0;--pink:#ff5d8f;--yellow:#ffd166;--mint:#69e6bd;--purple:#8067e8;--line:#e8def5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:'Baloo 2',sans-serif;background:var(--cream);overflow-x:hidden}
body:before,body:after{content:"";position:fixed;z-index:-1;border-radius:50%;opacity:.7}body:before{width:280px;height:280px;background:var(--yellow);top:-90px;right:-70px}body:after{width:230px;height:230px;background:var(--mint);bottom:-80px;left:-60px}
.shell{width:min(760px,100%);margin:auto;padding:28px 20px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.logo{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--purple)}.score-pill{background:var(--ink);color:#fff;border-radius:999px;padding:7px 14px;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;box-shadow:4px 4px 0 var(--pink)}
.hero{margin-bottom:20px}.eyebrow{margin:0 0 4px;color:var(--pink);font-family:'Space Mono',monospace;font-size:12px;font-weight:700;text-transform:uppercase}.hero h1{margin:0;font-size:clamp(42px,9vw,76px);line-height:.9;letter-spacing:-.03em}.hero h1 span{color:var(--purple)}.subtitle{max-width:510px;margin:14px 0 24px;color:var(--muted);font-size:18px;font-weight:600}
.progress-wrap{display:flex;align-items:center;gap:12px;margin-bottom:16px;color:var(--muted);font-family:'Space Mono',monospace;font-size:11px;font-weight:700}.progress{height:12px;flex:1;padding:3px;background:#eee4f6;border:1px solid var(--line);border-radius:999px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--purple));border-radius:999px;transition:width .35s ease}
.card{background:#fff;border:2px solid var(--ink);border-radius:26px;padding:clamp(22px,5vw,38px);box-shadow:9px 9px 0 var(--ink);animation:pop .45s ease both}.question-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;color:var(--muted);font-family:'Space Mono',monospace;font-size:11px;font-weight:700}.sticker{display:inline-block;padding:5px 9px;background:var(--yellow);color:var(--ink);border-radius:7px;transform:rotate(-2deg)}.q{margin:0 0 24px;font-size:clamp(25px,5vw,38px);line-height:1.08;font-weight:800}.answers{display:grid;gap:12px}.ans{width:100%;padding:15px 17px;border:2px solid var(--line);border-radius:15px;background:#fffcff;color:var(--ink);font:600 17px 'Baloo 2',sans-serif;text-align:left;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}.ans:hover:not(:disabled){border-color:var(--purple);transform:translate(-3px,-3px);box-shadow:4px 4px 0 var(--purple)}.ans:disabled{cursor:default}.ans.correct{background:var(--mint);border-color:var(--ink);box-shadow:4px 4px 0 var(--ink)}.ans.wrong{background:#ffd5df;border-color:var(--pink);color:#8f254b}.feedback{min-height:50px;margin:20px 0 0;color:var(--muted);font-size:17px;font-weight:600}.next,.restart{border:0;border-radius:13px;padding:12px 19px;background:var(--ink);color:#fff;font:700 16px 'Baloo 2',sans-serif;cursor:pointer;box-shadow:4px 4px 0 var(--purple);transition:transform .15s ease}.next:hover,.restart:hover{transform:translate(-2px,-2px)}
.meme-zone{display:grid;gap:8px;margin:0 0 24px}.drag-hint{margin:0;color:var(--muted);font-family:'Space Mono',monospace;font-size:10px;font-weight:700;text-transform:uppercase}.meme-card{padding:18px 20px;background:var(--purple);color:#fff;border:2px solid var(--ink);border-radius:18px;cursor:grab;box-shadow:5px 5px 0 var(--ink);user-select:none;transition:transform .15s ease,background .15s ease}.meme-card:active,.meme-card.selected{background:var(--pink);transform:rotate(-1deg) scale(1.02)}.meme-emoji{display:block;margin-bottom:4px;font-size:32px;line-height:1}.meme-top,.meme-bottom{display:block;font-weight:800;line-height:1.05}.meme-top{font-size:20px}.meme-bottom{margin-top:5px;color:#fff1a8;font-size:15px}.ans.drag-over{background:#ede6ff;border-color:var(--purple);transform:translateX(4px)}
.result{text-align:center}.result .emoji{font-size:58px;line-height:1}.result h2{margin:12px 0 4px;font-size:32px}.score{margin:8px 0;color:var(--purple);font-family:'Space Mono',monospace;font-size:54px;font-weight:700}.result p{color:var(--muted);font-size:18px}.result .restart{margin-top:12px;background:var(--pink);box-shadow:4px 4px 0 var(--ink)}
@keyframes pop{from{opacity:0;transform:translateY(10px) rotate(.5deg)}to{opacity:1;transform:none}}@media(max-width:500px){.shell{padding:22px 15px 36px}.hero h1{font-size:50px}.card{box-shadow:6px 6px 0 var(--ink)}.ans{font-size:16px}.meme-card{padding:16px}}
</style></head>
<body>
<div class="shell"><header class="top"><div class="logo">MEME / LITERACY / 2026</div><div class="score-pill" id="scoreTop">0 P</div></header><section class="hero"><p class="eyebrow">15 frågor • 1 chans att inte bli cooked</p><h1>Är du <span>cooked?</span> 💀</h1><p class="subtitle">Testa din rizz, aura och meme-logik. Välj med magkänslan. Eller ren delulu.</p></section><div class="progress-wrap"><div class="progress"><div class="bar" id="bar"></div></div><span id="progressText">01 / 15</span></div><main class="card" id="card"></main></div>
<script>
const qs=[
{q:"En person får hela rummet att skratta och verkar väldigt charmig. Vilket uttryck passar bäst?",a:["rizz","aura","delulu","NPC"],c:0,e:"Rizz handlar om charm – särskilt romantisk eller flirtig sådan."},
{q:"Du säger att du verkligen menar det du skriver. Vilket uttryck kan du lägga till?",a:["no cap","frfr","sus","cooked"],c:0,e:"No cap betyder ungefär på riktigt eller jag ljuger inte."},
{q:"En kompis betonar att något verkligen stämmer. Vilket uttryck använder kompisen?",a:["frfr","no cap","delulu","rizzler"],c:0,e:"Frfr betyder for real, for real – ungefär på riktigt."},
{q:"En elev löser den svåraste uppgiften direkt och får alla att tappa hakan. Vilket uttryck passar?",a:["+1000 aura","GigaChad","cooked","NPC"],c:0,e:"Aura används skämtsamt som ett mått på coolhet eller social pondus."},
{q:"Vilket uttryck passar när du vinkar tillbaka, men inser att personen vinkade till någon bakom dig?",a:["aura loss","sus","delulu","GigaChad"],c:0,e:"Pinsamt socialt misslyckande = klassisk aura loss."},
{q:"Vad kallar man skämtsamt en person som är särskilt bra på att charma?",a:["rizzler","NPC","sigma","cooked"],c:0,e:"Rizzler är en skämtsam benämning på någon med mycket rizz."},
{q:"Vilket uttryck beskriver en överdrivet självsäker och idealiserad person?",a:["GigaChad","NPC behavior","delulu","aura loss"],c:0,e:"GigaChad är den överdrivna, idealiserade versionen av Chad."},
{q:"Du har inte pluggat och provet börjar om två minuter. Vilket uttryck beskriver läget?",a:["cooked","no cap","rizz","GigaChad"],c:0,e:"Cooked betyder körd eller illa ute i situationen."},
{q:"En person tror att en kändis är kär i dem bara för att kändisen gillade en kommentar. Vilket uttryck passar?",a:["delulu","frfr","sus","rizzler"],c:0,e:"Delulu kommer från delusional och används om orealistiska föreställningar."},
{q:"En person upprepar samma repliker hela kvällen och känns mekanisk. Vilket uttryck passar?",a:["NPC behavior","GigaChad","infinite aura","rizz"],c:0,e:"NPC anspelar på spelens non-player characters."},
{q:"Hela klassen blir chockad av en nyhet som egentligen borde ha varit förutsebar. Vilken reaktion passar?",a:["Surprised Pikachu","This is fine","GigaChad","NPC"],c:0,e:"Surprised Pikachu används som en överdriven chockreaktion."},
{q:"En elev börjar med uppgiften sent på kvällen trots att allt är kaos. Vilken meme passar bäst?",a:["This is fine","+1000 aura","GigaChad","Rizzler"],c:0,e:"This is fine passar när situationen uppenbart är kaos men personen låtsas att allt är lugnt."},
{q:"En person nekar till att ha ätit kakan, men har choklad runt hela munnen. Vilket uttryck passar?",a:["sus","delulu","no cap","NPC"],c:0,e:"Sus betyder suspicious, alltså misstänkt."},
{q:"En elev håller ett imponerande tal utan manus och får hela klassen att lyssna. Vilken kommentar passar?",a:["Bro gained infinite aura.","Bro is cooked.","Bro is delulu.","NPC behavior."],c:0,e:"En imponerande prestation kan skämtsamt beskrivas som massiv aura gain."},
{q:"En person pluggar inte eftersom den tror att exakt det den redan kan kommer på provet. Vilket uttryck passar?",a:["delulu","frfr","no cap","rizzler"],c:0,e:"Att lita på en orealistiskt optimistisk föreställning är väldigt delulu."}
];
function shuffleAnswers(question){
	const answers=question.a.map((text,index)=>({text,correct:index===question.c}));
	for(let index=answers.length-1;index>0;index--){
		const randomIndex=Math.floor(Math.random()*(index+1));
		[answers[index],answers[randomIndex]]=[answers[randomIndex],answers[index]];
	}
	question.a=answers.map(answer=>answer.text);
	question.c=answers.findIndex(answer=>answer.correct);
}
qs.forEach(shuffleAnswers);
const memes=[
 {emoji:"😏",top:"När du säger en helt vanlig mening",bottom:"men den har rizz ändå."},
 {emoji:"🍔",top:"Den där burgaren var sjukligt god",bottom:"no cap."},
 {emoji:"📢",top:"Jag menar det här",bottom:"frfr."},
 {emoji:"🗿",top:"Löser den svåraste uppgiften direkt",bottom:"+1000 aura."},
 {emoji:"🫣",top:"Du vinkar tillbaka...",bottom:"men personen vinkade bakom dig."},
 {emoji:"😎",top:"När någon går in i rummet",bottom:"med maximal rizz."},
 {emoji:"💪",top:"Jag har aldrig fel",bottom:"GigaChad energy."},
 {emoji:"🔥",top:"Provet börjar om två minuter",bottom:"bro, you're cooked."},
 {emoji:"🤡",top:"Hon gillade min kommentar",bottom:"hon är definitivt kär. Delulu."},
 {emoji:"🧍",top:"Samma tre repliker hela kvällen",bottom:"NPC behavior."},
 {emoji:"😮",top:"När läraren säger prov imorgon",bottom:"Surprised Pikachu."},
 {emoji:"🔥",top:"Börjar uppgiften 23:47",bottom:"This is fine."},
 {emoji:"👀",top:"Jag åt inte kakan",bottom:"säger personen med choklad runt munnen."},
 {emoji:"🏆",top:"Håller ett perfekt tal utan manus",bottom:"Bro gained infinite aura."},
 {emoji:"🔮",top:"Jag pluggar inte",bottom:"det kommer säkert exakt rätt ändå."}
];
let i=0,score=0,locked=false;
function render(){locked=false;const x=qs[i],meme=memes[i];document.getElementById("bar").style.width=(i/qs.length*100)+"%";document.getElementById("progressText").textContent=String(i+1).padStart(2,"0")+" / "+String(qs.length).padStart(2,"0");document.getElementById("scoreTop").textContent=score+" P";document.getElementById("card").innerHTML=`<div class="question-meta"><span class="sticker">FRÅGA ${String(i+1).padStart(2,"0")}</span><span>Dra memet till rätt svar</span></div><div class="meme-zone"><p class="drag-hint">Meme drop</p><div class="meme-card" id="meme" draggable="true" ondragstart="startDrag(event)" onclick="selectMeme(this)"><span class="meme-emoji">${meme.emoji}</span><span class="meme-top">${meme.top}</span><span class="meme-bottom">${meme.bottom}</span></div></div><h2 class="q">${x.q}</h2><div class="answers">${x.a.map((v,j)=>`<button class="ans" ondragover="allowDrop(event,this)" ondragleave="leaveDrop(this)" ondrop="dropAnswer(event,${j},this)" onclick="pick(${j},this)"><strong>${String.fromCharCode(65+j)}.</strong> ${v}</button>`).join("")}</div><p class="feedback" id="fb"></p><button class="next" id="next" onclick="go()" hidden>Nästa fråga →</button>`;}
function selectMeme(el){if(locked)return;el.classList.toggle("selected");}
function startDrag(event){event.dataTransfer.setData("text/plain","meme");}
function allowDrop(event,el){event.preventDefault();if(!locked)el.classList.add("drag-over");}
function leaveDrop(el){el.classList.remove("drag-over");}
function dropAnswer(event,j,el){event.preventDefault();el.classList.remove("drag-over");pick(j,el);}
function pick(j,el){if(locked)return;locked=true;const x=qs[i],bs=[...document.querySelectorAll(".ans")];bs[x.c].classList.add("correct");if(j!==x.c)el.classList.add("wrong");else score++;bs.forEach(b=>b.disabled=true);document.getElementById("fb").textContent=(j===x.c?"🔥 Rätt! ":"💀 Inte riktigt. ")+x.e;document.getElementById("scoreTop").textContent=score+" P";document.getElementById("next").hidden=false;}
function go(){i++;if(i<qs.length)render();else finish();}
function finish(){document.getElementById("bar").style.width="100%";document.getElementById("progressText").textContent="KLAR";const message=score>=13?"ABSOLUT GIGACHAD 🗿":score>=10?"Stark aura. No cap.":score>=7?"Du överlevde. Frfr.":"Bro… you're cooked 💀";const emoji=score>=10?"🏆":score>=7?"😎":"🫠";document.getElementById("card").innerHTML=`<div class="result"><div class="emoji">${emoji}</div><div class="eyebrow">SLUTRESULTAT</div><div class="score">${score} / ${qs.length}</div><h2>${message}</h2><p>Du fick ${Math.round(score/qs.length*100)} % rätt.</p><button class="restart" onclick="location.reload()">Kör igen ↻</button></div>`;}
render();
</script>
</body></html>
